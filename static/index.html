<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test Frontières</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body,#map{height:100%;margin:0;padding:0}
    #map{position:fixed;left:0;right:0;top:0;bottom:0}
    .info{position:absolute; left:10px; top:10px; z-index:1000; background:rgba(255,255,255,0.9); padding:10px; border-radius:4px; box-shadow:0 0 15px rgba(0,0,0,0.2); max-width:300px}
    .country{font-weight:bold;font-size:18px;color:#2c3e50}
    .loading {display:inline-block; border:3px solid #f3f3f3; border-top:3px solid #3498db; border-radius:50%; width:16px; height:16px; animation:spin 1s linear infinite; margin-left:10px; vertical-align:middle}
    @keyframes spin {0% {transform:rotate(0deg)} 100% {transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">Cliquez sur la carte pour identifier le pays.</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  // Configurer la base URL pour l'API
  const API_BASE_URL = 'http://127.0.0.1:5000';
  
  // Initialiser la carte avec vue sur l'Europe
  const map = L.map('map').setView([46, 2], 5);
  
  // Options de couches de tuiles
  const basemaps = {
    'OpenMapTiles (Streets)': L.tileLayer('https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key={apikey}', {
      attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
      apikey: '', // Sera rempli par l'API du serveur
      tileSize: 512,
      zoomOffset: -1,
      minZoom: 1,
      maxZoom: 19
    }),
    'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }),
    'OpenMapTiles (Satellite)': L.tileLayer('https://api.maptiler.com/maps/hybrid/{z}/{x}/{y}.jpg?key={apikey}', {
      attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
      apikey: '', // Sera rempli par l'API du serveur
      tileSize: 512,
      zoomOffset: -1,
      minZoom: 1,
      maxZoom: 19
    })
  };
  
  // Ajouter la couche par défaut (OpenStreetMap pour l'instant)
  basemaps['OpenStreetMap'].addTo(map);
  
  // Récupérer la clé API OpenMapTiles depuis le serveur
  fetch(`${API_BASE_URL}/api/map-config`)
    .then(response => response.json())
    .then(config => {
      if (config.openmaptiles_key) {
        // Mettre à jour les couches avec la clé API
        basemaps['OpenMapTiles (Streets)'].options.apikey = config.openmaptiles_key;
        basemaps['OpenMapTiles (Satellite)'].options.apikey = config.openmaptiles_key;
        
        // Si la clé est valide, utiliser OpenMapTiles comme couche par défaut
        map.removeLayer(basemaps['OpenStreetMap']);
        basemaps['OpenMapTiles (Streets)'].addTo(map);
      }
      
      // Ajouter le contrôle des couches
      L.control.layers(basemaps, {}, {position: 'topright'}).addTo(map);
    })
    .catch(err => {
      console.error('Erreur lors de la récupération de la configuration de la carte:', err);
      // Continuer avec OpenStreetMap comme fallback
      L.control.layers(basemaps, {}, {position: 'topright'}).addTo(map);
    });

  // Variables pour stocker les éléments affichés sur la carte
  let currentCountryLayer = null;
  let currentMarker = null;
  
  // Détection du pays au clic
  map.on('click', function(e) {
    // Nettoyer les marqueurs et pays précédents
    if (currentMarker) map.removeLayer(currentMarker);
    if (currentCountryLayer) map.removeLayer(currentCountryLayer);
    
    // Récupérer les coordonnées
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    
    // Ajouter un marqueur à l'emplacement du clic
    currentMarker = L.marker(e.latlng).addTo(map);
    
    // Afficher message de chargement
    document.getElementById('info').innerHTML = 'Identification du pays <div class="loading"></div>';
    
    // Construire l'URL pour l'API
    const url = `${API_BASE_URL}/api/country-at-point?lat=${lat}&lon=${lng}`;
    
    // Appeler l'API pour obtenir le pays à ces coordonnées
    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Erreur HTTP: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        console.log('Réponse API:', data);
        
        // Vérifier si nous avons des fonctionnalités
        if (!data.features || data.features.length === 0) {
          document.getElementById('info').innerHTML = 'Aucun pays trouvé à cette position.';
          currentMarker.bindTooltip("Aucun pays").openTooltip();
          return;
        }
        
        // Récupérer le premier (et généralement unique) pays trouvé
        const country = data.features[0];
        const props = country.properties;
        
        // Utiliser les données enrichies si disponibles
        const enhanced = props._enhanced || {};
        
        // Trouver le meilleur nom pour le lieu
        const locationName = enhanced.best_name || 
                             props.name || 
                             props.country || 
                             props.state || 
                             props.city || 
                             'Lieu inconnu';
                             
        // Déterminer le niveau administratif ou le type de lieu
        const adminType = enhanced.admin_type || 
                          (props.admin_level ? `Niveau administratif ${props.admin_level}` : 'Lieu');
        
        // Afficher le pays sur la carte avec un style différent selon le type
        const isCountry = adminType.includes('Country') || adminType.includes('Pays');
        
        // Log pour le débogage des géométries
        console.log('Feature:', country);
        console.log('Geometry type:', country.geometry ? country.geometry.type : 'No geometry');
        console.log('Has coordinates:', country.geometry && country.geometry.coordinates ? 'Yes' : 'No');
        if (country.geometry && country.geometry.coordinates) {
          console.log('Coordinates length:', 
                      Array.isArray(country.geometry.coordinates) ? 
                      (country.geometry.coordinates.length + ' items') : 'not an array');
          console.log('Coordinates sample:', JSON.stringify(country.geometry.coordinates).substring(0, 100) + '...');
        }
        
        // Display ALL features if we have multiple
        if (data.features && data.features.length > 1) {
          console.log(`Displaying all ${data.features.length} features from response`);
          
          // Appliquer un style plus visible pour les frontières (pour toutes les features)
          currentCountryLayer = L.geoJSON(data, {
            style: feature => ({
              color: '#2980b9',
              weight: 4,
              fillColor: '#3498db',
              fillOpacity: 0.2,
              dashArray: '0',
              smoothFactor: 1
            }),
            onEachFeature: (feature, layer) => {
              // Add popup with administrative information
              if (feature.properties) {
                const props = feature.properties;
                const enhanced = props._enhanced || {};
                const name = enhanced.best_name || props.name || props.country || 'Unknown';
                const level = props.admin_level || 'Unknown';
                const adminType = enhanced.admin_type || `Level ${level}`;
                
                let popupContent = `<b>${name}</b><br>Type: ${adminType}`;
                
                // Add additional properties if available
                if (props.country_code) popupContent += `<br>Country Code: ${props.country_code}`;
                
                layer.bindPopup(popupContent);
              }
            }
          }).addTo(map);
        } else {
          // Just display the single feature
          console.log('Displaying single feature');
          
          // Appliquer un style plus visible pour les frontières
          currentCountryLayer = L.geoJSON(country, {
            style: {
              color: isCountry ? '#2980b9' : '#e67e22',
              weight: isCountry ? 4 : 3,
              fillColor: isCountry ? '#3498db' : '#f39c12',
              fillOpacity: 0.2,
              dashArray: isCountry ? '0' : '5, 5',
              smoothFactor: 1
            },
            onEachFeature: (feature, layer) => {
              // Add popup with administrative information
              if (feature.properties) {
                const props = feature.properties;
                const enhanced = props._enhanced || {};
                const name = enhanced.best_name || props.name || props.country || 'Unknown';
                const level = props.admin_level || 'Unknown';
                const adminType = enhanced.admin_type || `Level ${level}`;
                
                let popupContent = `<b>${name}</b><br>Type: ${adminType}`;
                
                // Add additional properties if available
                if (props.country_code) popupContent += `<br>Country Code: ${props.country_code}`;
                
                layer.bindPopup(popupContent);
              }
            }
          }).addTo(map);
        }
        
        // Zoomer pour voir la zone entière (si besoin)
        if (map.getZoom() > 6 && currentCountryLayer) {
          try {
            // Make sure the layer has bounds before trying to zoom
            const bounds = currentCountryLayer.getBounds();
            if (bounds.isValid()) {
              console.log('Zooming to bounds:', bounds);
              map.flyToBounds(bounds, {
                padding: [50, 50],
                maxZoom: 8,
                duration: 1
              });
            } else {
              console.warn('Layer has invalid bounds');
            }
          } catch(e) {
            console.warn('Impossible de zoomer sur la zone:', e);
          }
        }
        
        // Recueillir les informations disponibles sur le lieu
        const details = [];
        
        // Ajouter les informations pertinentes si disponibles
        if (props.country && props.country !== locationName) 
          details.push(`Pays: ${props.country}`);
        if (props.state && props.state !== locationName) 
          details.push(`Région: ${props.state}`);
        if (props.county && props.county !== locationName) 
          details.push(`Département: ${props.county}`);
        if (props.city && props.city !== locationName) 
          details.push(`Ville: ${props.city}`);
        
        // Si aucun détail n'est disponible, ajouter le type administratif
        if (details.length === 0) {
          details.push(adminType);
        }
        
        // Afficher le nom du lieu dans l'info panel
        const info = `
          <div class="country">${locationName}</div>
          <div>${details.join('<br>')}</div>
          <div><small>Lat: ${lat.toFixed(4)}, Lon: ${lng.toFixed(4)}</small></div>
        `;
        
        document.getElementById('info').innerHTML = info;
        
        // Ajouter le nom au marqueur
        currentMarker.bindTooltip(locationName).openTooltip();
        
        // Lire le nom du lieu à voix haute
        let speechText = `Vous êtes dans ${locationName}`;
        
        // Si nous avons un pays et qu'il diffère du nom de lieu, l'ajouter à la synthèse vocale
        if (props.country && props.country !== locationName) {
          speechText = `Vous êtes à ${locationName}, dans ${props.country}`;
        }
        
        speakText(speechText);
      })
      .catch(err => {
        console.error('Erreur:', err);
        document.getElementById('info').innerHTML = `Erreur: ${err.message}<br>Vérifiez que le serveur est démarré.`;
      });
  });

  // Fonction pour la synthèse vocale
  function speakText(text) {
    // Vérifier si la synthèse vocale est disponible
    if (!window.speechSynthesis) {
      console.warn("La synthèse vocale n'est pas supportée par ce navigateur");
      return;
    }
    
    try {
      // Créer un nouvel objet SpeechSynthesisUtterance
      const utterance = new SpeechSynthesisUtterance(text);
      
      // Configurer la voix
      utterance.lang = 'fr-FR'; // Voix française
      utterance.rate = 1.0;     // Vitesse normale
      utterance.pitch = 1.0;    // Hauteur normale
      utterance.volume = 1.0;   // Volume maximum
      
      // Parler
      window.speechSynthesis.speak(utterance);
      
      console.log('Synthèse vocale:', text);
    } catch(e) {
      console.error('Erreur de synthèse vocale:', e);
    }
  }
  </script>
</body>
</html>
